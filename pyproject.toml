[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-report-automation"
version = "1.0.0"
description = "Validate order exports and build auditable Excel sales reports."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sales-report = "sales_report.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
